<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 챗봇 미리보기</title>
<style>
  :root { --bg:#b2c7d9; --me:#fee500; --bot:#fff; --text:#191919; --sub:#666; --line:#e5e5e5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background:var(--bg); color:var(--text); font-size:17px; }
  header { background:#a9bdce; padding:12px 16px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  header small { font-weight:400; color:#334; font-size:13px; }
  #chat { padding:16px; padding-bottom:140px; max-width:520px; margin:0 auto; }
  .me { display:flex; justify-content:flex-end; margin:12px 0; }
  .me div { background:var(--me); padding:10px 14px; border-radius:16px 4px 16px 16px; max-width:80%; white-space:pre-wrap; }
  .bot { margin:10px 0; }
  .bubble { background:var(--bot); padding:12px 14px; border-radius:4px 16px 16px 16px; white-space:pre-wrap; max-width:88%; line-height:1.5; }
  .carousel { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; }
  .card { background:var(--bot); border-radius:12px; min-width:240px; max-width:240px; overflow:hidden; scroll-snap-align:start; flex-shrink:0; }
  .card img { width:100%; height:120px; object-fit:cover; display:block; background:#ffd98a; }
  .card .body { padding:10px 12px; }
  .card h4 { margin:0 0 4px; font-size:17px; }
  .card p { margin:0; color:var(--sub); font-size:15px; white-space:pre-wrap; }
  .btn { display:block; width:100%; border:0; border-top:1px solid var(--line); background:#fff; padding:12px; font-size:16px; cursor:pointer; color:var(--text); text-decoration:none; text-align:center; }
  .list { background:var(--bot); border-radius:12px; max-width:88%; overflow:hidden; }
  .list .head { padding:12px 14px; font-weight:700; border-bottom:1px solid var(--line); }
  .list .item { display:block; padding:10px 14px; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  .list .item b { display:block; font-weight:600; }
  .list .item span { color:var(--sub); font-size:15px; }
  .quick { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .quick button { border:1px solid #8aa; background:#fff; border-radius:18px; padding:8px 14px; font-size:16px; cursor:pointer; }
  details { margin-top:6px; font-size:12px; }
  details pre { background:#fff; padding:8px; overflow:auto; max-height:300px; border-radius:6px; }
  form { position:fixed; bottom:0; left:0; right:0; background:#fff; padding:10px 16px; display:flex; gap:8px; justify-content:center; }
  form input { flex:1; max-width:420px; font-size:17px; padding:12px; border:1px solid #ccc; border-radius:10px; }
  form button { font-size:17px; padding:0 18px; background:var(--me); border:0; border-radius:10px; cursor:pointer; }
  .note { text-align:center; font-size:12px; color:#334; margin:4px 0 12px; }
</style>
</head>
<body>
<header>여행 도우미 챗봇 <small id="mode"></small></header>
<div id="chat"><p class="note">카카오톡 화면을 흉내 낸 미리보기예요. 실제 카톡 화면과 조금 다를 수 있어요.</p></div>
<form id="f"><input id="q" placeholder="예) 부산에서 둘이 경주 다음주 토요일" autocomplete="off"><button>보내기</button></form>
<script>
const chat = document.getElementById('chat');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function renderButton(b) {
  if (b.action === 'webLink') { const a = el('a', 'btn', b.label); a.href = b.webLinkUrl; a.target = '_blank'; return a; }
  if (b.action === 'share') {
    const s = el('button', 'btn', b.label);
    s.onclick = () => alert('카카오톡에서는 여기서 친구·가족을 골라 이 말풍선을 그대로 보내는 화면이 열려요.\n받은 사람은 [계획표·예약 보기]를 눌러 대신 예약할 수 있어요.');
    return s;
  }
  const btn = el('button', 'btn', b.label); btn.onclick = () => send(b.messageText || b.label); return btn;
}
function renderBasicCard(c) {
  const card = el('div', 'card');
  if (c.thumbnail) { const img = el('img'); img.src = c.thumbnail.imageUrl; img.alt = ''; card.appendChild(img); }
  const body = el('div', 'body'); body.appendChild(el('h4', null, c.title)); body.appendChild(el('p', null, c.description));
  card.appendChild(body);
  (c.buttons || []).forEach((b) => card.appendChild(renderButton(b)));
  return card;
}
function renderListCard(c) {
  const box = el('div', 'list'); box.appendChild(el('div', 'head', c.header.title));
  c.items.forEach((it) => {
    const row = el(it.link ? 'a' : 'div', 'item');
    if (it.link) { row.href = it.link.web; row.target = '_blank'; }
    row.appendChild(el('b', null, it.title)); if (it.description) row.appendChild(el('span', null, it.description));
    box.appendChild(row);
  });
  (c.buttons || []).forEach((b) => box.appendChild(renderButton(b)));
  return box;
}
function render(json) {
  const wrap = el('div', 'bot');
  for (const o of json.template.outputs) {
    const row = el('div'); row.style.margin = '6px 0';
    if (o.simpleText) row.appendChild(el('div', 'bubble', o.simpleText.text));
    if (o.textCard) {
      const box = el('div', 'list');
      box.appendChild(el('div', 'head', o.textCard.title));
      const d = el('div', 'bubble', o.textCard.description); d.style.borderRadius = '0'; d.style.maxWidth = 'none';
      box.appendChild(d);
      (o.textCard.buttons || []).forEach((b) => box.appendChild(renderButton(b)));
      row.appendChild(box);
    }
    if (o.listCard) row.appendChild(renderListCard(o.listCard));
    if (o.basicCard) row.appendChild(renderBasicCard(o.basicCard));
    if (o.carousel) { const c = el('div', 'carousel'); o.carousel.items.forEach((i) => c.appendChild(renderBasicCard(i))); row.appendChild(c); }
    wrap.appendChild(row);
  }
  const q = el('div', 'quick');
  (json.template.quickReplies || []).forEach((r) => { const b = el('button', null, r.label); b.onclick = () => send(r.messageText); q.appendChild(b); });
  wrap.appendChild(q);
  const d = el('details'); d.appendChild(el('summary', null, '카카오로 보내는 JSON 보기')); d.appendChild(el('pre', null, JSON.stringify(json, null, 2)));
  wrap.appendChild(d);
  chat.appendChild(wrap);
}
async function send(text) {
  const me = el('div', 'me'); me.appendChild(el('div', null, text)); chat.appendChild(me);
  const res = await fetch('/skill', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userRequest: { utterance: text, user: { id: 'preview-user', type: 'botUserKey' } } }) });
  render(await res.json());
  window.scrollTo(0, document.body.scrollHeight);
}
document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const v = q.value.trim(); if (v) { send(v); q.value = ''; } };
fetch('/health').then((r) => r.json()).then((h) => {
  document.getElementById('mode').textContent = `기차: ${h.trainApi ? '실제' : '예시'} · 장소검색: ${h.kakaoPlaces ? '연결' : '없음'}`;
});
send('처음으로');
</script>
</body>
</html>
