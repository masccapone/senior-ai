# Render 배포 설정 (Blueprint). Render 화면에서 New → Blueprint → 이 저장소를 고르면 아래대로 만들어집니다.
services:
  - type: web
    name: senior-ai
    runtime: node
    region: singapore        # 한국과 가장 가까운 지역 (카카오 5초 제한에 유리)
    plan: starter            # 잠들지 않는 최소 유료 요금제. free 는 잠들어서 카카오 응답이 실패합니다.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:                    # 출발지 기억·대화 기록이 재배포 후에도 남도록
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN       # 결과 보고서 열쇠 (Render가 자동으로 만들어 줌)
        generateValue: true
      - key: HASH_SALT         # 사용자 코드를 만들 때 섞는 값 (자동 생성)
        generateValue: true
      - key: KAKAO_REST_API_KEY
        sync: false            # 배포할 때 Render 화면에서 직접 입력
      - key: DATA_GO_KR_KEY
        sync: false
      - key: AGODA_CID
        sync: false
